<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>orSend · 客户端控制台</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="client.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">or<span>Send</span></div>
    <div class="sub">客户端控制台</div>
  </div>
  <div class="topbar-right">
    <span id="enginePill" class="pill pill-idle"><i></i>未连接</span>
    <button id="btnToggle" class="btn btn-primary">连接服务端</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="overview">概览</button>
  <button class="tab" data-tab="tunnels">隧道</button>
  <button class="tab" data-tab="logs">日志</button>
  <button class="tab" data-tab="settings">设置</button>
</nav>

<main>
  <!-- 概览 -->
  <section id="tab-overview" class="tab-panel active">
    <div class="stats">
      <div class="stat">
        <div class="stat-label">连接状态</div>
        <div class="stat-value" id="statState">未连接</div>
        <div class="stat-hint" id="statStateHint">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">在线时长</div>
        <div class="stat-value" id="statUptime">—</div>
        <div class="stat-hint">与服务端保持连接的时间</div>
      </div>
      <div class="stat">
        <div class="stat-label">活跃连接</div>
        <div class="stat-value" id="statStreams">0</div>
        <div class="stat-hint">正在穿透的会话</div>
      </div>
      <div class="stat">
        <div class="stat-label">已注册隧道</div>
        <div class="stat-value" id="statTunnels">0</div>
        <div class="stat-hint">公网可访问的端口</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>连接配置</h2>
        <span class="muted" id="uptimeText"></span>
      </div>
      <form class="form-grid" id="connectForm">
        <label>
          <span>服务端地址</span>
          <input name="server" placeholder="公网服务器 IP:7000" required />
        </label>
        <label>
          <span>访问 token</span>
          <input name="token" placeholder="与服务端一致" />
        </label>
        <label>
          <span>客户端标识</span>
          <input name="clientId" placeholder="home-nas" />
        </label>
        <label>
          <span>显示名称</span>
          <input name="name" placeholder="家里的 NAS" />
        </label>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">保存并连接</button>
          <span class="muted" id="exePathText"></span>
        </div>
      </form>
      <div class="alert alert-error" id="engineError" hidden></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>隧道概览</h2></div>
      <div class="mini-list" id="tunnelOverview"><div class="empty">暂无隧道</div></div>
    </div>
  </section>

  <!-- 隧道 -->
  <section id="tab-tunnels" class="tab-panel">
    <div class="card">
      <div class="card-head">
        <h2>隧道列表</h2>
        <span class="muted">把内网端口映射到公网服务器的端口</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>隧道名</th><th>内网目标</th><th>公网端口</th><th>状态</th><th>连接数</th><th></th></tr>
          </thead>
          <tbody id="tunnelRows"><tr><td colspan="6" class="empty">暂无隧道</td></tr></tbody>
        </table>
      </div>
      <form class="inline-form" id="tunnelForm">
        <input name="name" placeholder="隧道名 web" required />
        <input name="localHost" placeholder="内网地址 127.0.0.1" value="127.0.0.1" />
        <input name="localPort" type="number" placeholder="内网端口 8080" min="1" max="65535" required />
        <input name="remotePort" type="number" placeholder="公网端口 18080（留空自动分配）" min="0" max="65535" />
        <button class="btn btn-primary" type="submit">添加隧道</button>
      </form>
    </div>
  </section>

  <!-- 日志 -->
  <section id="tab-logs" class="tab-panel">
    <div class="card">
      <div class="card-head">
        <h2>运行日志</h2>
        <div class="row-gap">
          <label class="switch"><input type="checkbox" id="autoScroll" checked /><span>自动滚动</span></label>
          <button class="btn btn-ghost" id="btnClearLogs">清空视图</button>
        </div>
      </div>
      <div class="log-view" id="logView"></div>
    </div>
  </section>

  <!-- 设置 -->
  <section id="tab-settings" class="tab-panel">
    <div class="card">
      <div class="card-head"><h2>客户端设置</h2></div>
      <form class="form-grid" id="settingsForm">
        <label>
          <span>控制接口端口</span>
          <input name="controlPort" type="number" min="1" max="65535" />
        </label>
        <label>
          <span>日志级别</span>
          <select name="logLevel">
            <option value="info">info</option>
            <option value="debug">debug</option>
            <option value="warn">warn</option>
            <option value="error">error</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" name="autoConnect" />
          <span>打开页面时自动连接</span>
        </label>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">保存并重启引擎</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="card-head"><h2>引擎输出</h2></div>
      <pre class="engine-output" id="engineOutput">—</pre>
    </div>
  </section>
</main>

<div class="toast-wrap" id="toastWrap"></div>
<script src="app.js"></script>
</body>
</html>
